{% extends 'chat/base.html' %}

{% block content %}
<div class="mx-auto max-w-3xl px-4 py-12 sm:px-6 lg:px-8 w-full flex-grow">
    <div class="glass-panel rounded-2xl p-8 sm:p-10 shadow-2xl animate-fade-in-up">
        <div class="mb-8 border-b border-slate-800 pb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-white sm:text-4xl">{% block legal_title %}{% endblock %}</h1>
            <p class="mt-3 text-sm text-slate-400">{% block legal_effective_date %}{% endblock %}</p>
        </div>

        <div class="legal-content prose prose-invert max-w-none text-slate-300 space-y-6 text-sm leading-relaxed">
            {% block legal_content %}{% endblock %}
        </div>

        <div class="mt-10 pt-6 border-t border-slate-800">
            <a href="{% url 'landing' %}" class="inline-flex items-center gap-2 text-sm font-medium text-indigo-400 hover:text-indigo-300 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                Вернуться на главную
            </a>
        </div>
    </div>
</div>

<style>
    .legal-content h2 {
        font-size: 1.125rem;
        font-weight: 700;
        color: #f1f5f9;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
    }
    .legal-content h3 {
        font-size: 1rem;
        font-weight: 600;
        color: #e2e8f0;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
    }
    .legal-content p {
        color: #94a3b8;
        margin-bottom: 0.75rem;
    }
    .legal-content ul {
        list-style-type: disc;
        padding-left: 1.25rem;
        color: #94a3b8;
        margin-bottom: 0.75rem;
    }
    .legal-content ul li {
        margin-bottom: 0.35rem;
    }
    .legal-content strong {
        color: #e2e8f0;
        font-weight: 600;
    }
    .legal-content hr {
        border-color: rgba(51, 65, 85, 0.6);
        margin: 1.5rem 0;
    }
</style>
{% endblock %}
